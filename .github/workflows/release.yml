# Domain Memory release workflow
#
# Publishes the three workspace packages to npm when a `v*` tag is pushed.
# Order matters: server first, then web (depends on server), then the CLI
# (depends on both). If any publish step fails, later steps are skipped so
# we don't end up with a CLI that references an unpublished server.
#
# Trigger:
#   git tag -a vX.Y.Z -m "Release X.Y.Z" && git push origin vX.Y.Z
#
# Authentication: npm Trusted Publishing (OIDC). No NPM_TOKEN required —
# each package on npmjs.com is configured to trust publishes coming from
# this repo and this workflow file. Provenance attestations are generated
# automatically.

name: Release

on:
  push:
    tags:
      - 'v*'

# Prevent two release runs from racing on overlapping tag pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # required by softprops/action-gh-release
      id-token: write   # enables npm Trusted Publishing (OIDC) + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify tag matches package versions
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # Strip leading "v" from the tag — `v0.1.0` -> `0.1.0`.
          expected="${GIT_TAG#v}"
          for pkg in packages/server packages/web packages/cli; do
            actual=$(node -p "require('./${pkg}/package.json').version")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Tag ${GIT_TAG} expects ${expected} but ${pkg}/package.json is ${actual}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test --workspaces --if-present

      # Publish order: server -> web -> cli. If one fails, the remaining
      # steps are skipped (default behaviour) so we never publish a CLI
      # that points at an unpublished server.
      #
      # No NODE_AUTH_TOKEN: npm CLI detects the GitHub Actions OIDC
      # environment and exchanges it for a short-lived publish token
      # against the trusted publisher configured for each package.
      # Each publish step is idempotent: queries the registry first and
      # skips if name+version already exists, so partial-failure re-runs
      # are safe. No untrusted inputs are interpolated — `name` and
      # `version` come from the local package.json on the checked-out tag.
      - name: Publish @mashware/domain-memory-server
        working-directory: packages/server
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish @mashware/domain-memory-web
        working-directory: packages/web
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish @mashware/domain-memory
        working-directory: packages/cli
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            # As an MCP server (no install needed)
            # Add to .mcp.json / .cursor/mcp.json / etc.:
            {
              "command": "npx",
              "args": ["-y", "@mashware/domain-memory-server"]
            }

            # CLI (install, doctor, web viewer)
            npm install -g @mashware/domain-memory
            ```

            ## Packages published

            - [`@mashware/domain-memory-server`](https://www.npmjs.com/package/@mashware/domain-memory-server)
            - [`@mashware/domain-memory-web`](https://www.npmjs.com/package/@mashware/domain-memory-web)
            - [`@mashware/domain-memory`](https://www.npmjs.com/package/@mashware/domain-memory)

      # ----- MCP Registry (preview) -----------------------------------------
      # Publish the server's metadata to registry.modelcontextprotocol.io so it
      # shows up in MCP client discovery. The registry only stores metadata that
      # points at the npm package published above. Ownership is proven by the
      # `mcpName` field in packages/server/package.json (which must equal the
      # `name` in server.json) plus GitHub OIDC for the io.github.mashware/*
      # namespace — no extra secret required. The registry is in preview, so
      # this flow may need updates as it stabilises.
      - name: Sync server.json version to the tag
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version="${GIT_TAG#v}"
          jq --arg v "$version" '.version = $v | .packages |= map(.version = $v)' \
            server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
